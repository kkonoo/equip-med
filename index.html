<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공동기기@KNUmed</title>
<meta name="description" content="여러 연구실이 같이 쓰는 공동기기 예약과 기기별 매뉴얼">
<meta name="apple-mobile-web-app-title" content="공동기기">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="themeColor" content="#F5F4F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/app-192.png">
<link rel="apple-touch-icon" href="icons/app-maskable-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="user">

<header class="topbar">
  <h1 class="app-title"><img src="icons/app-192.png" alt=""><span>공동기기<span class="at">@KNUmed</span></span></h1>
  <div class="seg app-only" id="tabSeg">
    <button type="button" data-tab="book">예약</button>
    <button type="button" data-tab="mine">내 예약</button>
    <button type="button" data-tab="equip">기기</button>
  </div>
  <div class="tools">
    <a class="btn" id="adminLink" href="admin.html" hidden>관리<span class="wide-only">자 페이지</span> <span class="badge" id="adminBadge" title="처리할 승인 대기" hidden></span></a>
    <button class="avatar" id="accountBtn" hidden></button>
  </div>
</header>

<main>
  <section id="gate" class="gate"></section>

  <section id="app" hidden>
    <!-- 예약: 기기 고르기 + 주간 그리드 (booking.js) -->
    <div class="tab" id="tab-book" hidden></div>

    <!-- 내 예약: 다가오는 예약·지난 예약, 사용일지 (mine.js) -->
    <div class="tab" id="tab-mine" hidden></div>

    <!-- 기기: 카드 목록, 누르면 매뉴얼 (equipment.js) -->
    <div class="tab" id="tab-equip" hidden></div>
  </section>
</main>

<dialog id="equipDlg"></dialog>
<dialog id="bookDlg"></dialog>
<dialog id="bookInfoDlg"></dialog>

<script src="js/app.js"></script>
<script src="js/booking.js"></script>
<script src="js/equipment.js"></script>
<script type="module" src="js/sync.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
